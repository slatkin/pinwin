[package]
name = "pinwin"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Pin a Ghostty window (e.g. mbv) to the edge of niri as a fixed sidebar."
license = "MIT"
repository = "https://github.com/slatkin/pinwin"
keywords = ["terminal", "niri", "layer-shell", "gtk4"]
categories = ["command-line-utilities"]
# The pinned libghostty-vt archive is built by build.rs from the commit in
# build.rs (port-to-rust D2); it is deliberately not a Cargo dependency.
build = "build.rs"

[lib]
name = "pinwin"
path = "src/lib.rs"

[[bin]]
name = "pinwin"
path = "src/main.rs"

[dependencies]
# The winsize ioctl, the non-blocking fcntl switch, raise(SIGWINCH) and the
# raw read/write on the host-supplied master fd (port-to-rust D7); libc is
# already in the lock as a transitive dependency.
libc = "0.2"

# The v4_12 features on gtk4/gdk4 enable `ScrollUnit` (the scroll
# controller's unit, which the scroll translation needs — port-to-rust row
# 3.7) and `Surface::scale()` (the fractional output scale the grid snapping
# reads — snap-grid-edges D3); both are otherwise plain transitive
# dependencies.
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
pango = "0.22"
pangocairo = "0.22"
cairo-rs = "0.22"
gdk-pixbuf = "0.22"

gdk4 = { version = "0.11", features = ["v4_12"] }

# port-to-rust D5: panics must never cross the public API, so the unwind
# runtime is required for the catch_unwind guards at every boundary. Setting
# `panic = "abort"` is forbidden: it would abort the host instead.
# `test` inherits `dev`, so this also covers the test profile.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

[lints.clippy]
mod_module_files = "deny"
# Cannot be overridden by an inline allow/expect: params structs, not
# suppressions.
too_many_arguments = "forbid"
cognitive_complexity = "warn"
excessive_nesting = "warn"
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# pinwin adaptation (mbv forbids all suppression; #13 ledgers approvals):
# reasoned allows are permitted so approved exceptions (generated table,
# intentional geometry casts) can exist under `-D warnings`, but every allow
# must still carry a `reason` and have per-instance user approval tracked in
# issue #13.
allow_attributes = "allow"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"
# Transitive dependency version skew with no source fix; converges as
# upstreams update.
multiple_crate_versions = { level = "allow" }
# No rustdoc is published, so hand-written `# Errors` sections would be
# filler.
missing_errors_doc = { level = "allow" }

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
