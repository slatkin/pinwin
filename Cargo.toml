[package]
name = "pinwin"
version = "0.3.2"
edition = "2024"
rust-version = "1.90"
description = "Pin a Ghostty window (e.g. mbv) to the edge of niri as a fixed sidebar."
license = "MIT"
repository = "https://github.com/slatkin/pinwin"
keywords = ["terminal", "niri", "layer-shell", "wayland"]
categories = ["command-line-utilities"]
# The pinned libghostty-vt archive is still built by build.rs from the
# commit in build.rs (port-to-rust D2); adopt-libghostty-rs moves the
# terminal core to the `libghostty-vt` crate below, and task 5.1 removes
# this build script together with `ghostty_sys`.
build = "build.rs"

[lib]
name = "pinwin"
path = "src/lib.rs"

[[bin]]
name = "pinwin"
path = "src/main.rs"

[dependencies]
# The terminal emulation core (adopt-libghostty-rs A1): the safe API over
# libghostty-vt, pinned at the first master commit that carries both the
# ghostty pin bump (#84) and `RowIteration::viewport_y` (#85). Default
# features (kitty-graphics) stay; `png` stays off because pinwin decodes
# PNG with the `png` crate above.
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "e1e145f22bace96593ecaa348c09d874635ef637" }

# The winsize ioctl, the non-blocking fcntl switch, raise(SIGWINCH) and the
# raw read/write on the host-supplied master fd (port-to-rust D7); libc is
# already in the lock as a transitive dependency.
libc = "0.2"

# The direct Wayland client stack (replace-gtk-with-wayland D1, row 2.1). The
# toolkit's defaults are the calloop and xkbcommon features the row names; the
# connection is the pure-Rust wayland backend, so
# no libwayland link step is needed.
wayland-client = "0.31"
# `staging` adds wp_fractional_scale_v1 (D5's preferred-scale source); the
# stable `client` set already carries wp_viewporter.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
smithay-client-toolkit = "0.21"
calloop = "0.14"
calloop-wayland-source = "0.4"

# The keyboard handler's own xkbcommon state (replace-gtk-with-wayland D8,
# row 5.1): the toolkit hands the keymap over as a string and its KeyEvent
# carries no consumed modifiers or level-0 keysym, so the seat side keeps a
# keymap and state of its own. Same 0.8 line the toolkit pins, so one shared
# build.
xkbcommon = "0.8"

# The renderer's CPU stack (replace-gtk-with-wayland D5/D6, row 2.1):
# tiny-skia fills and scales, swash shapes and rasterizes, fontconfig resolves
# the Ghostty family (D6) and png decodes the kitty images.
tiny-skia = "0.12"
swash = "0.2"
fontconfig = "0.11"
# The `fontconfig` wrapper exposes no charset accessor; the fallback lookup
# decides coverage from the candidate patterns' own `charset` property
# through the underlying -sys crate (already linked as the wrapper's
# dependency, same version).
yeslogic-fontconfig-sys = "6"
png = "0.18"

# The renderer's one f64-to-integer seam (`render::geom::device_px`):
# tiny-skia takes i32/f32 geometry while the snapped edges are f64, and a
# NumCast conversion keeps the cast lints quiet without a suppression.
num-traits = "0.2"

# port-to-rust D5: panics must never cross the public API, so the unwind
# runtime is required for the catch_unwind guards at every boundary. Setting
# `panic = "abort"` is forbidden: it would abort the host instead.
# `test` inherits `dev`, so this also covers the test profile.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

[lints.clippy]
mod_module_files = "deny"
# Cannot be overridden by an inline allow/expect: params structs, not
# suppressions.
too_many_arguments = "forbid"
cognitive_complexity = "warn"
excessive_nesting = "warn"
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# pinwin adaptation (mbv forbids all suppression; #13 ledgers approvals):
# reasoned allows are permitted so approved exceptions (generated table,
# intentional geometry casts) can exist under `-D warnings`, but every allow
# must still carry a `reason` and have per-instance user approval tracked in
# issue #13.
allow_attributes = "allow"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"
# Transitive dependency version skew with no source fix; converges as
# upstreams update.
multiple_crate_versions = { level = "allow" }
# No rustdoc is published, so hand-written `# Errors` sections would be
# filler.
missing_errors_doc = { level = "allow" }

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
