name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'openspec/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'openspec/**'
  workflow_dispatch:

# One commit means one build. Keying on the commit SHA makes a tag run
# supersede the branch run for the same commit instead of building twice.
# A pull_request run is keyed on its merge commit SHA, so it never shares a
# group with a main-branch push run; forked PRs only ever get read access.
#
# The asymmetry matters: only an incoming *tag* run cancels (it is the last
# and authoritative ref). An incoming branch or PR run waits its turn, so if
# the two pushes were ever received out of order the release still runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Pin a dated snapshot of the Arch base-devel builder image instead of the
    # floating `base-devel` tag. Arch is rolling, so bump this periodically
    # (dated archlinux tags are retained ~18 months on Docker Hub) and keep the
    # base-devel-... literal in the cargo cache key below in sync.
    container: archlinux/archlinux:base-devel-20260818.0.575430
    permissions:
      # The release tag's PKGBUILD checksum commit below pushes to main.
      contents: write

    steps:
      # The pinned archlinux base-devel image ships no git, and
      # actions/checkout falls back to a REST API archive download when git is
      # missing from the PATH. That yields no .git directory. Install makedeps
      # (including git) first so checkout performs a real git clone.
      - name: Update system and install makedeps
        run: |
          pacman_retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              pacman -Syy --noconfirm
              sleep $((attempt * 10))
            done
            "$@"
          }
          pacman_retry pacman -Syu --noconfirm
          # `rustup` instead of `rust`: the Arch `rust` package is rebuilt for
          # every upstream point release and package revision, and each bump
          # invalidates the cargo cache below (full rebuild). The toolchain
          # comes from the pinned rust-toolchain.toml instead, so it changes
          # only when that pin is bumped deliberately. clang stays a system
          # package (native build-script tooling, not a cache-keyed compiler).
          # The proxy stack is pure Rust, so no system library packages are
          # needed. GTK and gtk4-layer-shell left with row 8.2: the ldd step
          # below fails the build if anything pulled them back in.
          pacman_retry pacman -S --noconfirm --needed rustup clang \
            git

      - uses: actions/checkout@v7

      # A release tag must name the version Cargo.toml builds, so the binary
      # and checksum published for vX.Y.Z cannot silently describe some other
      # version. Failed early, before the expensive build steps.
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match" \
              "Cargo.toml version $version"
            exit 1
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Record Rust toolchain version
        run: echo "RUSTC_VER=$(rustc --version | tr ' ' '_')" >> "$GITHUB_ENV"

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            target
          # Key covers: pinned builder image + pinned rustc toolchain (build
          # environment), the dependency lockfile, and all manifests.
          # The base-devel-... literal must match the `container:` image above;
          # bump it with rust-toolchain.toml.
          key: ${{ format('{0}-cargo-{1}-base-devel-20260818.0.575430-{2}',
            runner.os, env.RUSTC_VER,
            hashFiles('rust-toolchain.toml', '**/Cargo.lock',
            '**/Cargo.toml')) }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Audit dependencies
        run: cargo audit

      # The client tests assume a session-like environment: XDG_RUNTIME_DIR
      # must resolve to a directory so the no-listener tests reach the
      # connect failure (exit 1) instead of the environment error (exit 2).
      # The container has no Wayland session, so point it at scratch.
      - name: Build and test
        env:
          XDG_RUNTIME_DIR: /tmp
        run: cargo nextest run && cargo build

      # "No toolkit libraries" (replace-gtk-with-wayland): the built pinwin
      # binary must not link GTK, GDK, GLib, GObject, GIO, Pango, Cairo,
      # gdk-pixbuf or HarfBuzz, directly or through another library. ldd
      # prints the whole transitive closure, so one grep covers both paths.
      # `test -x` fails loudly when the binary is missing: ldd then errors
      # and grep finds nothing, which must not read as a clean list.
      - name: Check dynamic dependencies
        run: |
          forbidden='lib(gtk|gdk|glib|gobject|gio|pango|cairo|pixbuf|harfbuzz)'
          test -x target/debug/pinwin
          if ldd target/debug/pinwin | grep -Eiq "$forbidden"; then
            echo 'Forbidden toolkit library linked into pinwin:'
            ldd target/debug/pinwin | grep -Ei "$forbidden"
            exit 1
          fi

      # The checkout lands owned by another uid than the step user, so git
      # calls the line-count script makes refuse with dubious-ownership.
      # Marking the workspace safe is the documented container-job fix.
      - name: Check code file lines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/check-code-file-lines.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pinwin-linux-x86_64
          path: |
            target/debug/pinwin
          if-no-files-found: error

      # Release-only steps: a tag run builds the optimized binary, repeats the
      # no-toolkit check on it, and stages the named file plus its checksum
      # for the release job. Non-tag runs stop at the debug artifact above.
      - name: Build release binary
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo build --release

      - name: Check release binary dynamic dependencies
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          forbidden='lib(gtk|gdk|glib|gobject|gio|pango|cairo|pixbuf|harfbuzz)'
          test -x target/release/pinwin
          if ldd target/release/pinwin | grep -Eiq "$forbidden"; then
            echo 'Forbidden toolkit library linked into pinwin:'
            ldd target/release/pinwin | grep -Ei "$forbidden"
            exit 1
          fi

      - name: Stage release files and checksum
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=${GITHUB_REF_NAME#v}
          # The tarball is the AUR package's source (PKGBUILD): the pinned
          # top-level folder carries the binary and the license text.
          mkdir -p "pinwin-${version}"
          cp target/release/pinwin "pinwin-${version}/pinwin"
          cp LICENSE "pinwin-${version}/LICENSE"
          tar czf "pinwin-${version}-linux-x86_64.tar.gz" "pinwin-${version}"
          mkdir -p dist
          cp target/release/pinwin dist/pinwin-linux-x86_64
          cp "pinwin-${version}-linux-x86_64.tar.gz" dist/
          cd dist
          sha256sum pinwin-linux-x86_64 > pinwin-linux-x86_64.sha256
          sha256sum "pinwin-${version}-linux-x86_64.tar.gz" \
            > "pinwin-${version}-linux-x86_64.tar.gz.sha256"

      - name: Commit PKGBUILD with sha256 to main
        if: startsWith(github.ref, 'refs/tags/')
        # Non-fatal: the retries below handle the common non-fast-forward race
        # (main advanced since checkout on a detached HEAD), but losing every
        # retry must not abort the job before the AUR publish trigger. AUR
        # reads the sha256 from the release asset, not this commit, so a missed
        # PKGBUILD commit is cosmetic and can be redone by hand.
        continue-on-error: true
        run: |
          # Checkout runs as root in this image, so the repo is root-owned;
          # user steps run as a different uid. Git's safe.directory protection
          # then refuses every command ("dubious ownership"); the exception
          # checkout itself writes lands in a temp HOME, invisible here.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          version=${GITHUB_REF_NAME#v}
          sha256=$(sha256sum "pinwin-${version}-linux-x86_64.tar.gz" \
            | cut -d' ' -f1)
          sed -i "s/^pkgver=.*/pkgver=${version}/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${sha256}')/" PKGBUILD
          git config user.name "pinwin release"
          git config user.email "github@poo.town"
          git add PKGBUILD
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "Set the ${version} AUR package checksum"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}), rebasing" >&2
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: pinwin-release-x86_64
          path: |
            dist/pinwin-linux-x86_64
            dist/pinwin-linux-x86_64.sha256
            dist/pinwin-*-linux-x86_64.tar.gz
            dist/pinwin-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The AUR trigger below dispatches aur.yml through the API.
      actions: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: pinwin-release-x86_64
          path: dist

      # Create the release once, then re-runs upload with --clobber so a
      # failed job can be retried for the same tag. A hyphenated tag is a
      # prerelease (v0.5.0-rc1); the release action is gh itself, with the
      # job's GITHUB_TOKEN, so no third-party action sees the token.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac
          if view_output=$(gh release view "$GITHUB_REF_NAME" 2>&1); then
            gh release upload "$GITHUB_REF_NAME" \
              dist/pinwin-linux-x86_64 dist/pinwin-linux-x86_64.sha256 \
              dist/pinwin-*-linux-x86_64.tar.gz \
              dist/pinwin-*-linux-x86_64.tar.gz.sha256 --clobber
          elif grep -qi 'release not found' <<< "$view_output"; then
            gh release create "$GITHUB_REF_NAME" \
              dist/pinwin-linux-x86_64 dist/pinwin-linux-x86_64.sha256 \
              dist/pinwin-*-linux-x86_64.tar.gz \
              dist/pinwin-*-linux-x86_64.tar.gz.sha256 \
              --generate-notes --verify-tag "${prerelease[@]}"
          else
            printf '::error::Could not check for an existing release: %s\n' \
              "$view_output"
            exit 1
          fi

      # Fire-and-forget, as in mbv: AUR publishing runs in its own workflow
      # (aur.yml) from the published release, so an AUR failure can never fail
      # this build, and a failed publish can be retried by dispatching aur.yml
      # by hand. The trigger waits for the release above, because aur.yml reads
      # the tarball from the release asset.
      - name: Trigger AUR publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run aur.yml -f version="${GITHUB_REF_NAME#v}"
